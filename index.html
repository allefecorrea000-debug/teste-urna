<body>

<!-- BOTÃO DE TELA CHEIA - ADICIONADO -->
<button type="button" class="btn-tela-cheia" id="btnTelaCheia">
  ⛶ Tela Cheia
</button>

<div class="live-frame">
  <header class="banner">
    <div class="chamada">🔥 COMENTE E ESCOLHA! 🔥</div>

    <div class="placar-lados" id="placarLados"></div>

  </section>

  <main class="urna">
    <div class="topo">
      <section class="tela" id="tela" aria-live="polite">
        <div class="simbolo" data-vistas="inicio"></div>
        <h1 id="titulo" data-vistas="inicio erro">VOTAÇÃO</h1>

        <div class="candidato" id="candidato" data-vistas="candidato">
          <div class="numero-candidato" id="candNumero"></div>
          <img id="candFoto" alt="">
          <div class="nome" id="candNome"></div>
          <div class="partido" id="candPartido"></div>
          <div class="instrucao">Aperte CONFIRMA para finalizar</div>
        </div>

        <div class="digitos" id="digitos" data-vistas="inicio erro" aria-label="Número digitado">
          <div class="digito"></div><div class="digito"></div>
        </div>
        <div class="mensagem" id="mensagem" data-vistas="inicio erro branco"></div>
      </section>

      <div class="lado-direito">
        <div class="logo">SISTEMA<br>ELEITORAL</div>
        <div class="teclado" id="teclado">
          <button type="button" class="tecla" data-tecla="1">1</button>
          <button type="button" class="tecla" data-tecla="2">2</button>
          <button type="button" class="tecla" data-tecla="3">3</button>
          <button type="button" class="tecla" data-tecla="4">4</button>
          <button type="button" class="tecla" data-tecla="5">5</button>
          <button type="button" class="tecla" data-tecla="6">6</button>
          <button type="button" class="tecla" data-tecla="7">7</button>
          <button type="button" class="tecla" data-tecla="8">8</button>

            <button type="button" class="btn branco" data-acao="branco">BRANCO</button>

  </main>

  <div class="vencedor" id="vencedor" role="alertdialog" aria-live="assertive" hidden>
    <div class="venc-titulo">VENCEDOR DA RODADA</div>
    <div class="venc-nome" id="vencNome"></div>
    <div class="venc-placar" id="vencPlacar"></div>
    <button type="button" class="venc-btn" id="btnNova">NOVA RODADA</button>
    <div class="venc-dica">Enter ou N também iniciam a próxima rodada</div>
  </div>
</div>

<script>
/* ============ CONFIGURAÇÃO (edite aqui) ============ */
const CONFIG = {
  meta: 200,
  reiniciarAposMs: 4000,
  som: true,
  candidatos: {
    "13": { nome: "LULA",             rotulo: "LULA",   partido: "PT", imagem: "lula.jpg",   cor: "#f7c900" },
    "22": { nome: "FLÁVIO BOLSONARO", rotulo: "FLÁVIO", partido: "PL", imagem: "flavio.jpg", cor: "#2196f3" }
  }
};
/* ==================================================== */

/* TELA CHEIA - ADICIONADO */
const btnTelaCheia = document.getElementById('btnTelaCheia');

async function alternarTelaCheia() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (erro) {
    console.warn('Não foi possível alterar o modo de tela cheia:', erro);
  }
}

btnTelaCheia.addEventListener('click', alternarTelaCheia);

document.addEventListener('fullscreenchange', () => {
  btnTelaCheia.textContent = document.fullscreenElement
    ? '⛶ Sair da Tela Cheia'
    : '⛶ Tela Cheia';
});
/* FIM DA ADIÇÃO DE TELA CHEIA */

const $ = (id) => document.getElementById(id);
const tela = $('tela');
const caixas = [...document.querySelectorAll('.digito')];
const foto = $('candFoto');

const FOTO_PADRAO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130"><rect width="100" height="130" fill="#e6e6e6"/>' +
  '<circle cx="50" cy="48" r="22" fill="#b5b5b5"/><path d="M10 130c0-30 18-46 40-46s40 16 40 46z" fill="#b5b5b5"/></svg>'
);

const estado = { digitos: '', branco: false, finalizado: false, aviso: '' };
let timerReinicio = null;

/* ---------- Placar (salvo no navegador, sobrevive a recarregar a página) ---------- */
const CHAVE_PLACAR = 'urna-placar-v1';
const placar = { rodada: 1, votos: {}, brancos: 0, historico: [], vencedor: null };
Object.keys(CONFIG.candidatos).forEach((n) => { placar.votos[n] = 0; });
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE_PLACAR));
  if (salvo) Object.assign(placar, salvo, { votos: { ...placar.votos, ...salvo.votos } });
} catch (e) { /* sem armazenamento: segue com placar zerado */ }

function salvarPlacar() {
  try { localStorage.setItem(CHAVE_PLACAR, JSON.stringify(placar)); } catch (e) { /* ignora */ }
}

$('placarLados').innerHTML = Object.entries(CONFIG.candidatos).map(([n, c]) => `
  <div class="lado" id="lado${n}" style="--cor:${c.cor}">
    <div class="lado-topo">
      <span class="lado-nome">${n} — ${c.rotulo}</span>
      <span class="lado-votos" id="votos${n}">0</span>
    </div>
    <div class="barra"><div class="barra-fill" id="barra${n}"></div></div>
  </div>`).join('');

function renderPlacar() {
  const nums = Object.keys(CONFIG.candidatos);
  const primeiro = placar.votos[nums[0]];
  const empate = nums.every((n) => placar.votos[n] === primeiro);
  const lider = nums.reduce((a, b) => (placar.votos[b] > placar.votos[a] ? b : a));
  const total = nums.reduce((soma, n) => soma + placar.votos[n], 0);

  nums.forEach((n) => {
    $('votos' + n).textContent = placar.votos[n];
    $('barra' + n).style.width = Math.min(100, (placar.votos[n] / CONFIG.meta) * 100) + '%';
    $('lado' + n).classList.toggle('lider', !empate && n === lider);
  });

  $('placarInfo').textContent =
    `Rodada ${placar.rodada} • Meta: ${CONFIG.meta} votos • Total: ${total} • Brancos: ${placar.brancos}`;

  $('vencedor').hidden = !placar.vencedor;
  if (placar.vencedor) {
    $('vencNome').textContent = CONFIG.candidatos[placar.vencedor].nome;
    $('vencPlacar').textContent = nums.map((n) => `${CONFIG.candidatos[n].rotulo} ${placar.votos[n]}`).join(' × ');
    $('btnNova').focus();
  }
}

function registrarVoto(num) {
  if (num) placar.votos[num]++; else placar.brancos++;
  placar.historico.push(num);
  if (placar.historico.length > 50) placar.historico.shift();
  if (num && placar.votos[num] >= CONFIG.meta) placar.vencedor = num;
  salvarPlacar();
  renderPlacar();
}

function desfazerVoto() {
  if (placar.vencedor || !placar.historico.length) return;
  const num = placar.historico.pop();
  if (num) placar.votos[num]--; else placar.brancos--;
  salvarPlacar();
  renderPlacar();
}

function novaRodada(avancar = true) {
  Object.keys(placar.votos).forEach((n) => { placar.votos[n] = 0; });
  Object.assign(placar, {
    brancos: 0,
    historico: [],
    vencedor: null,
    rodada: avancar ? placar.rodada + 1 : placar.rodada
  });
  salvarPlacar();
  renderPlacar();
  reiniciar();
}

/* ---------- Banner gerado a partir dos candidatos ---------- */
$('opcoes').innerHTML = Object.entries(CONFIG.candidatos)
  .map(([num, c]) => `<div class="opcao">${num} — ${c.rotulo}</div>`)
  .join('');

const numerosValidos = Object.keys(CONFIG.candidatos).join(' ou ');

/* ---------- Som ---------- */
let audioCtx = null;
function bipe(freq = 900, duracao = 0.07) {
  if (!CONFIG.som) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const ganho = audioCtx.createGain();
    osc.frequency.value = freq;
    ganho.gain.value = 0.08;
    osc.connect(ganho).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duracao);
  } catch (e) { /* áudio indisponível: ignora */ }
}

/* ---------- Renderização ---------- */
function vistaAtual() {
  if (estado.finalizado) return 'fim';
  if (estado.branco) return 'branco';
  if (CONFIG.candidatos[estado.digitos]) return 'candidato';
  if (estado.digitos.length === 2) return 'erro';
  return 'inicio';
}

function render() {
  const vista = vistaAtual();
  const cand = CONFIG.candidatos[estado.digitos];

  tela.dataset.vista = vista;
  tela.querySelectorAll('[data-vistas]').forEach((el) => {
    el.hidden = !el.dataset.vistas.split(' ').includes(vista);
  });

  $('titulo').textContent = vista === 'erro' ? 'NÚMERO ERRADO' : 'VOTAÇÃO';
  caixas.forEach((caixa, i) => { caixa.textContent = estado.digitos[i] ?? ''; });

  if (vista === 'candidato') {
    $('candNumero').textContent = 'NÚMERO ' + estado.digitos;
    $('candNome').textContent = cand.nome;
    $('candPartido').textContent = 'PARTIDO ' + cand.partido;
    foto.alt = 'Foto de ' + cand.nome;
    foto.onerror = () => { foto.onerror = null; foto.src = FOTO_PADRAO; };
    if (!foto.src.endsWith(cand.imagem)) foto.src = cand.imagem;
  }

  $('mensagem').textContent =
    estado.aviso || (vista === 'erro' ? `Digite ${numerosValidos} e aperte CONFIRMA.` : '');
}

/* ---------- Ações ---------- */
function digitar(d) {
  if (estado.finalizado || estado.branco || estado.digitos.length >= 2) return;
  estado.digitos += d;
  estado.aviso = '';
  bipe();
  render();
}

function corrigir() {
  if (estado.finalizado) return reiniciar();
  estado.digitos = '';
  estado.branco = false;
  estado.aviso = '';
  bipe(700);
  render();
}

function votarBranco() {
  if (estado.finalizado) return;
  estado.digitos = '';
  estado.branco = true;
  estado.aviso = '';
  bipe();
  render();
}

function confirmar() {
  if (estado.finalizado) return;
  const valido = estado.branco || CONFIG.candidatos[estado.digitos];
  if (!valido) {
    estado.aviso = `Digite ${numerosValidos} antes de confirmar.`;
    bipe(300, 0.15);
    return render();
  }
  registrarVoto(estado.branco ? null : estado.digitos);
  estado.finalizado = true;
  estado.digitos = '';
  estado.branco = false;
  estado.aviso = '';
  bipe(1000, 0.7);
  render();
  if (CONFIG.reiniciarAposMs > 0) timerReinicio = setTimeout(reiniciar, CONFIG.reiniciarAposMs);
}

function reiniciar() {
  clearTimeout(timerReinicio);
  Object.assign(estado, { digitos: '', branco: false, finalizado: false, aviso: '' });
  render();
}

/* ---------- Eventos ---------- */
$('teclado').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.tecla) digitar(btn.dataset.tecla);
  else if (btn.dataset.acao === 'branco') votarBranco();
  else if (btn.dataset.acao === 'corrige') corrigir();
  else if (btn.dataset.acao === 'confirma') confirmar();
  btn.blur();
});

$('btnNova').addEventListener('click', () => novaRodada());

document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  if (placar.vencedor) {
    if (k === 'enter' || k === 'n') { e.preventDefault(); novaRodada(); }
    return;
  }

  if (/^[0-9]$/.test(k)) digitar(k);
  else if (k === 'enter') { e.preventDefault(); confirmar(); }
  else if (k === 'backspace' || k === 'escape') corrigir();
  else if (k === 'z') desfazerVoto();
  else if (k === 'r' && e.shiftKey) novaRodada(false);
});

renderPlacar();
render();
</script>
